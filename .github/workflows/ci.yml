name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build .NET services
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ev-dealer-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build solution
        run: dotnet build DealerSystem.sln -clp:ErrorsOnly
      - name: Run unit tests
        # EventRetryPolicy + producer↔consumer payload contract tests
        # (DealerSystem.Tests, Issue #31). Reuses the build above. Run by
        # project path, NOT an FQN filter: `--filter` that matches zero tests
        # still exits 0, so a namespace rename would silently disable the
        # gate. The path form fails if the project is missing or has no tests.
        run: dotnet test DealerSystem.Tests/NotificationService.Tests/NotificationService.Tests.csproj --no-build

  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ev-dealer-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ev-dealer-frontend/package-lock.json
      - name: Verify LFS assets are real files
        # *.glb is tracked by Git LFS. Without smudge, checkout leaves a
        # ~130-byte text pointer, which vite copies verbatim into dist and
        # the landing page's GLTFLoader then fails to parse at runtime.
        # Fail loudly here instead of shipping a green-but-broken build.
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for f in public/*.glb; do
            found=1
            size=$(stat --format=%s "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 1000 ]; then
              echo "::error::$f is a Git LFS pointer, not the real asset ($size bytes)."
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning::no .glb files found under public/ - asset may have moved."
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
