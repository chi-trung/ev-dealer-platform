# --- Shared internal service-to-service key (Issue #92, P2) -----------------
# ReportingService's data-sync fan-out is machine-to-machine traffic with no
# user JWT, so Sales/Vehicle/Customer authenticate it with this shared key
# (Common/Auth/InternalServiceAuth.cs) instead of a user token.
#
# Referenced through ${INTERNAL_SERVICE_KEY:-<default>} at the four services
# that take part, so the value cannot drift between them. The `:-default` form
# is deliberate: a developer gets a working key with no setup, and a deployment
# that exports INTERNAL_SERVICE_KEY gets its own value everywhere at once.
#
# A YAML `&anchor` / `*alias` would be the other way to share one value, but it
# does NOT work here — the `environment` blocks below are list form, and in
# that form Compose passes `*name` through as a literal string rather than
# expanding it. Verified: `docker compose config` printed
# `InternalService__Key: '*internal-service-key'` until this was changed.
#
# The default below is a DEVELOPMENT value. Shipping it to a shared
# environment would be a working deployment with a publicly known secret, and
# the failure would be silent. On Render this is per-service `sync: false` in
# render.yaml — see the P6 deploy checklist.

services:
  # --- API Gateway (Ocelot) -------------------------------------------------
  # Publishes 5036 so the Vite frontend's VITE_API_BASE_URL is unchanged.
  # Gateway:Rewrites maps the six ocelot.json "localhost:<devport>" authorities
  # onto the in-network container addresses; a To may also be scheme-qualified
  # "https://host" for public URLs (Issue #78, see docs/GATEWAY.md).
  apigateway:
    # Build context is the management root: APIGatewayService.csproj has no
    # ProjectReference, but a root context keeps all seven services identical
    # and lets the shared .dockerignore at the root apply uniformly.
    build:
      context: .
      dockerfile: APIGatewayService/Dockerfile
    image: evdealer/apigateway:local
    container_name: evm_apigateway
    ports:
      - "5036:80"
    volumes:
      - ./APIGatewayService/Logs:/app/Logs   # Issue #63: same Serilog mount as the other services
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - Gateway__Rewrites__0__From=localhost:7001
      - Gateway__Rewrites__0__To=userservice:80
      - Gateway__Rewrites__1__From=localhost:5068
      - Gateway__Rewrites__1__To=vehicleservice:8080
      - Gateway__Rewrites__2__From=localhost:5003
      - Gateway__Rewrites__2__To=salesservice:80
      - Gateway__Rewrites__3__From=localhost:5039
      - Gateway__Rewrites__3__To=customerservice:80
      - Gateway__Rewrites__4__From=localhost:5208
      - Gateway__Rewrites__4__To=reportingservice:80
      - Gateway__Rewrites__5__From=localhost:5051
      - Gateway__Rewrites__5__To=notificationservice:80
    depends_on:
      # service_started, not service_healthy: the app-image healthchecks are
      # new in this PR (curl was absent from aspnet:8.0). Upgrade to
      # service_healthy once `docker compose ps` shows all healthy.
      userservice:
        condition: service_started
      vehicleservice:
        condition: service_started
      salesservice:
        condition: service_started
      customerservice:
        condition: service_started
      reportingservice:
        condition: service_started
      notificationservice:
        condition: service_started
    restart: unless-stopped
    networks:
      - ev-dealer-network

  # --- UserService (PostgreSQL; no RabbitMQ — verified zero broker usage) ---
  # P2: DB_PROVIDER=postgres + a Host=... string, mirroring render.yaml. The
  # sqliteFallback stays in Program.cs so a developer running the service
  # outside compose with no env vars still gets a local file rather than a
  # boot failure; here the connection string is present so the fallback never
  # applies.
  userservice:
    # Root context: UserService.csproj references ../Common/Common.csproj, which
    # a service-only context cannot supply at restore time (Issue #95).
    build:
      context: .
      dockerfile: UserService/Dockerfile
    image: evdealer/userservice:local
    container_name: evm_userservice
    ports:
      - "5223:80"
    volumes:
      - ./UserService/Logs:/app/Logs   # Issue #63: Serilog file sink path is not env-overridable
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - DB_PROVIDER=postgres
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=evm_core;Username=postgres;Password=postgres
      - Jwt__Key=ReplaceThisWithASecretKeyForDevelopment
      - Jwt__Issuer=evm.local
      - Jwt__Audience=evm.local
      - FrontendUrl=http://localhost:5173
      # Issue #121: UserService proxies /api/dealers and validates DealerId
      # against VehicleService, which now owns the Dealers table. Compose
      # service name is the DNS hostname on the shared network; internal port
      # 8080 (matches salesservice/reportingservice's existing entries).
      - Services__VehicleService=http://vehicleservice:8080
      # Issue #92: /api/internal/users is [Authorize(Roles=InternalService)].
      # Same shared key as the other four, same default -- see the header note
      # on why this is a plain variable rather than a YAML anchor.
      - InternalService__Key=${INTERNAL_SERVICE_KEY:-dev-only-internal-key-not-for-production}
      # Issue #92: signing key for the short-lived service token. Separate
      # variable from INTERNAL_SERVICE_KEY on purpose -- rotating the one
      # that is the bearer credential should not force a signing-key change,
      # and the dev default is deliberately distinct so a copy-paste between
      # the two is visible in a config dump rather than silent. Both must
      # match across the five participating services.
      - InternalService__SigningKey=${INTERNAL_SERVICE_SIGNING_KEY:-dev-only-signing-key-at-least-32-bytes}
      # Staged rollout. Both default off, so a fresh `docker compose up`
      # behaves exactly as before this change. Receivers flip
      # RequireSignedToken only after reportingservice sends tokens; see
      # Common/Auth/InternalServiceAuth.cs for the order with no gap.
      - InternalService__RequireSignedToken=${INTERNAL_REQUIRE_SIGNED_TOKEN:-false}
      - EmailSettings__SmtpHost=smtp.gmail.com
      - EmailSettings__SmtpPort=587
      - EmailSettings__SmtpUser=bata79892@gmail.com
      - EmailSettings__SmtpPassword=${EMAIL_SMTP_PASSWORD}
      - EmailSettings__FromEmail=bata79892@gmail.com
      - EmailSettings__FromName=EV Dealer
      - EmailSettings__EnableSsl=true
    restart: unless-stopped
    networks:
      - ev-dealer-network          # was missing: kept userservice off the shared network

  # --- VehicleService (PostgreSQL; producer-only, lazy/non-fatal broker) ----
  vehicleservice:
    # Root context: VehicleService.csproj references ../Common/Common.csproj.
    build:
      context: .
      dockerfile: VehicleService/Dockerfile
    image: evdealer/vehicleservice:local
    container_name: evm_vehicleservice
    ports:
      - "5224:8080"
    volumes:
      - ./VehicleService/wwwroot/images:/app/wwwroot/images   # uploads otherwise die with the container
      - ./VehicleService/Logs:/app/Logs   # Issue #63: Serilog file sink path is not env-overridable
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080   # pinned: base image defaults via ASPNETCORE_HTTP_PORTS=8080; keep explicit so it can never drift
      - DB_PROVIDER=postgres
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=evm_core;Username=postgres;Password=postgres
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      # Issue #92: target of ReportingService's fan-out. See the x- anchor.
      - InternalService__Key=${INTERNAL_SERVICE_KEY:-dev-only-internal-key-not-for-production}
      # Issue #92: signing key for the short-lived service token. Separate
      # variable from INTERNAL_SERVICE_KEY on purpose -- rotating the one
      # that is the bearer credential should not force a signing-key change,
      # and the dev default is deliberately distinct so a copy-paste between
      # the two is visible in a config dump rather than silent. Both must
      # match across the five participating services.
      - InternalService__SigningKey=${INTERNAL_SERVICE_SIGNING_KEY:-dev-only-signing-key-at-least-32-bytes}
      # Staged rollout. Both default off, so a fresh `docker compose up`
      # behaves exactly as before this change. Receivers flip
      # RequireSignedToken only after reportingservice sends tokens; see
      # Common/Auth/InternalServiceAuth.cs for the order with no gap.
      - InternalService__RequireSignedToken=${INTERNAL_REQUIRE_SIGNED_TOKEN:-false}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ev-dealer-network

  # --- SalesService (PostgreSQL; pure producer) ----------------------------
  salesservice:
    # Root context: SalesService.csproj references ../Common/Common.csproj.
    build:
      context: .
      dockerfile: SalesService/Dockerfile
    image: evdealer/salesservice:local
    container_name: evm_salesservice
    ports:
      - "5003:80"
    volumes:
      - ./SalesService/Logs:/app/Logs   # Issue #63: Serilog file sink path is not env-overridable
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - DB_PROVIDER=postgres
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=evm_core;Username=postgres;Password=postgres
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__Queues__SaleCompleted=sales.completed
      - RabbitMQ__Queues__OrderCreated=order.created
      - RabbitMQ__Queues__PaymentReceived=payment.received
      - RabbitMQ__Queues__OrderStatusChanged=order.status.changed
      - RabbitMQ__Queues__QuoteCreated=quote.created        # was implicit via appsettings; explicit now
      - RabbitMQ__Queues__ContractCreated=contract.created
      - Services__VehicleService=http://vehicleservice:8080
      # Issue #92: target of ReportingService's fan-out. See the x- anchor.
      - InternalService__Key=${INTERNAL_SERVICE_KEY:-dev-only-internal-key-not-for-production}
      # Issue #92: signing key for the short-lived service token. Separate
      # variable from INTERNAL_SERVICE_KEY on purpose -- rotating the one
      # that is the bearer credential should not force a signing-key change,
      # and the dev default is deliberately distinct so a copy-paste between
      # the two is visible in a config dump rather than silent. Both must
      # match across the five participating services.
      - InternalService__SigningKey=${INTERNAL_SERVICE_SIGNING_KEY:-dev-only-signing-key-at-least-32-bytes}
      # Staged rollout. Both default off, so a fresh `docker compose up`
      # behaves exactly as before this change. Receivers flip
      # RequireSignedToken only after reportingservice sends tokens; see
      # Common/Auth/InternalServiceAuth.cs for the order with no gap.
      - InternalService__RequireSignedToken=${INTERNAL_REQUIRE_SIGNED_TOKEN:-false}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vehicleservice:
        condition: service_started
    restart: unless-stopped
    networks:
      - ev-dealer-network

  # --- CustomerService (NEW to compose; consumer of vehicle.reserved,
  #     W4 retry topology: customer_vehicle_reserved[.retry/.dlq]) -----------
  # NB: Jwt trio must byte-match userservice or every token CustomerService
  #     validates is rejected. ConnectionStrings honored via the Program.cs
  #     change in this PR (code used to hard-compute ContentRootPath/customers.db).
  customerservice:
    # Root context: CustomerService.csproj references ../Common/Common.csproj.
    build:
      context: .
      dockerfile: CustomerService/Dockerfile
    image: evdealer/customerservice:local
    container_name: evm_customerservice
    ports:
      - "5039:80"
    volumes:
      - ./CustomerService/Logs:/app/Logs   # Issue #63: Serilog file sink path is not env-overridable
    environment:
      - ASPNETCORE_ENVIRONMENT=Development   # gates Database.Migrate() (Program.cs)
      - ASPNETCORE_URLS=http://+:80
      - DB_PROVIDER=postgres
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=evm_core;Username=postgres;Password=postgres
      - Jwt__Key=ReplaceThisWithASecretKeyForDevelopment
      - Jwt__Issuer=evm.local
      - Jwt__Audience=evm.local
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__MaxDeliveryAttempts=3
      - RabbitMQ__RetryTtlMilliseconds=5000
      # Issue #92: target of ReportingService's fan-out. See the x- anchor.
      - InternalService__Key=${INTERNAL_SERVICE_KEY:-dev-only-internal-key-not-for-production}
      # Issue #92: signing key for the short-lived service token. Separate
      # variable from INTERNAL_SERVICE_KEY on purpose -- rotating the one
      # that is the bearer credential should not force a signing-key change,
      # and the dev default is deliberately distinct so a copy-paste between
      # the two is visible in a config dump rather than silent. Both must
      # match across the five participating services.
      - InternalService__SigningKey=${INTERNAL_SERVICE_SIGNING_KEY:-dev-only-signing-key-at-least-32-bytes}
      # Staged rollout. Both default off, so a fresh `docker compose up`
      # behaves exactly as before this change. Receivers flip
      # RequireSignedToken only after reportingservice sends tokens; see
      # Common/Auth/InternalServiceAuth.cs for the order with no gap.
      - InternalService__RequireSignedToken=${INTERNAL_REQUIRE_SIGNED_TOKEN:-false}
      # Issue #150: the customer's login account is created in UserService,
      # which owns the Users table (#121), so this service is now a fan-out
      # SENDER. Unset, the HttpClient has no BaseAddress and provisioning fails
      # open: the customer row saves with UserId still null. The
      # INTERNAL_SERVICE_KEY above is already the credential this call signs
      # with, and userservice already accepts it -- nothing else to set.
      #
      # Intentionally NOT adding a SendSignedToken variable here: reportingservice
      # is the only sender with that on, and turning it on before userservice's
      # receiver is ready would 401 every call. Order in Common/Auth/InternalServiceAuth.cs.
      - Services__UserService=http://userservice:80
    depends_on:
      # Ordering nicety, not a correctness requirement. VehicleReservedEventConsumer
      # now reconnects with backoff on its own (verified live: stop broker →
      # log shows attempt 1/2/3/4 at 2s/4s/8s/16s → start broker → all 15
      # queues back to 1 consumer). Before that fix a broker down at boot killed
      # the consumer for the life of the process, so this condition was
      # load-bearing. Keep it: it removes the pointless retry log on cold start.
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ev-dealer-network

  # --- ReportingService (NEW; HTTP fan-out, no broker, no JWT) --------------
  # The stale claim that this service's only migration is SQLite-only DDL was
  # checked: it is plain TEXT/INTEGER store types + Sqlite:Autoincrement
  # annotations, both of which Npgsql accepts / ignores exactly as the other
  # services' migrations do. The Npgsql:ValueGenerationStrategy annotations
  # ARE present (P2 measured that they are load-bearing, not decorative) so
  # its int PKs get identity on Postgres like everyone else's.
  reportingservice:
    # Root context: ReportingService.csproj references ../Common/Common.csproj.
    build:
      context: .
      dockerfile: ReportingService/Dockerfile
    image: evdealer/reportingservice:local
    container_name: evm_reportingservice
    ports:
      - "5208:80"
    volumes:
      - ./ReportingService/Logs:/app/Logs   # Issue #63: Serilog file sink path is not env-overridable
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - DB_PROVIDER=postgres
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=evm_core;Username=postgres;Password=postgres
      - Services__SalesService=http://salesservice:80
      - Services__VehicleService=http://vehicleservice:8080
      - Services__UserService=http://userservice:80
      - Services__CustomerService=http://customerservice:80
      # Issue #92: this is the CALLER. The key goes on its outbound requests
      # (InternalServiceKeyHandler); the three services above verify it.
      - InternalService__Key=${INTERNAL_SERVICE_KEY:-dev-only-internal-key-not-for-production}
      # Issue #92: signing key for the short-lived service token. Separate
      # variable from INTERNAL_SERVICE_KEY on purpose -- rotating the one
      # that is the bearer credential should not force a signing-key change,
      # and the dev default is deliberately distinct so a copy-paste between
      # the two is visible in a config dump rather than silent. Both must
      # match across the five participating services.
      - InternalService__SigningKey=${INTERNAL_SERVICE_SIGNING_KEY:-dev-only-signing-key-at-least-32-bytes}
      # Staged rollout. Default off, so a fresh `docker compose up` behaves
      # exactly as before this change. This is the SENDING flag and it exists
      # only on reportingservice, the sole service that makes fan-out calls.
      # Set it true only once all four receivers understand tokens; until then
      # they would reject what this sends, and the symptom is the same silent
      # empty report this work exists to eliminate.
      - InternalService__SendSignedToken=${INTERNAL_SEND_SIGNED_TOKEN:-false}
    depends_on:
      postgres:
        condition: service_healthy
      userservice:
        condition: service_started
      vehicleservice:
        condition: service_started
      salesservice:
        condition: service_started
      customerservice:
        condition: service_started
      # Boot-time SynchronizeAllDataAsync() swallows failures; expect an empty
      # report DB after cold start — POST /api/reports/synchronize-data re-runs it.
    restart: unless-stopped
    networks:
      - ev-dealer-network

  # --- NotificationService (consumer of 14 queues; PostgreSQL device-token
  #     registry per Issue #33 / #92) --------------------------------------
  # Firebase credential file is intentionally NOT mounted: it doesn't exist in
  # the repo (secret), and Docker mounting a missing host path creates a
  # DIRECTORY over /app/firebase-credentials.json — worse than failing cleanly
  # at first FCM resolution. Without it: boot fine, push endpoints 500 on lazy
  # first use, consumed events cycle retry→DLQ. Provision the key out-of-band,
  # then either uncomment the bind mount below or:
  #   docker cp firebase-credentials.json evm_notificationservice:/app/firebase-credentials.json
  #   docker compose restart notificationservice
  notificationservice:
    # Root context: NotificationService.csproj references ../Common/Common.csproj.
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    image: evdealer/notificationservice:local
    container_name: evm_notificationservice
    ports:
      - "5051:80"
    volumes:
      - ./NotificationService/Logs:/app/Logs   # Serilog file sink path is not env-overridable
      # - ./NotificationService/firebase-credentials.json:/app/firebase-credentials.json:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      # Issue #92: this service used EnsureCreated(), which on the SHARED
      # database silently created nothing (render.yaml points all six services
      # at one evm_core). It now uses Migrate() like the rest.
      - DB_PROVIDER=postgres
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=evm_core;Username=postgres;Password=postgres
      # Issue #36: DeviceTokens API validates the same HS256 tokens UserService
      # mints — same key/issuer/audience as userservice/customerservice above.
      - Jwt__Key=ReplaceThisWithASecretKeyForDevelopment
      - Jwt__Issuer=evm.local
      - Jwt__Audience=evm.local
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__Queues__SaleCompleted=sales.completed
      - RabbitMQ__Queues__VehicleReserved=vehicle.reserved
      - RabbitMQ__Queues__TestDriveScheduled=testdrive.scheduled
      - RabbitMQ__Queues__OrderCreated=order.created
      - RabbitMQ__Queues__QuoteCreated=quote.created
      - RabbitMQ__Queues__ContractCreated=contract.created
      - RabbitMQ__Queues__CustomerCreated=customer.created
      - RabbitMQ__Queues__CustomerUpdated=customer.updated
      - RabbitMQ__Queues__CustomerDeleted=customer.deleted
      - RabbitMQ__Queues__PaymentReceived=payment.received
      - RabbitMQ__Queues__OrderStatusChanged=order.status.changed
      - RabbitMQ__Queues__VehicleCreated=vehicle.created
      - RabbitMQ__Queues__VehicleUpdated=vehicle.updated
      - RabbitMQ__Queues__VehicleDeleted=vehicle.deleted
      - RabbitMQ__MaxDeliveryAttempts=3
      - RabbitMQ__RetryTtlMilliseconds=5000
      - Firebase__CredentialPath=/app/firebase-credentials.json
      # Firebase__ProjectId omitted: appsettings.json already has the right value.
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ev-dealer-network

  # --- PostgreSQL 16 (the production database; P2) --------------------------
  # ONE instance, ONE database (evm_core) for all six DB-backed services —
  # deliberately mirroring render.yaml, where evm-postgres/databaseName=evm_core
  # is already wired into all six. The services keep DISJOINT table sets
  # (see the per-service baseline migrations), so they share the database
  # without sharing tables or migration ids.
  #
  # Do NOT give each service its own database here: that would make local
  # compose diverge from Render, and the failure this database is meant to
  # catch (NotificationService's EnsureCreated() seeing a non-empty database
  # and creating nothing) only reproduces when several services share one.
  postgres:
    image: "postgres:16"
    container_name: evm_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: evm_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready alone can go green before the init scripts finish, so a
      # Migrate() racing database creation would hit "database evm_core does
      # not exist". -d evm_core pins the probe to the database the services
      # actually connect to, not just the server.
      test: ["CMD-SHELL", "pg_isready -U postgres -d evm_core"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - ev-dealer-network

  # --- RabbitMQ (unchanged except position) ---------------------------------
  rabbitmq:
    image: "rabbitmq:3-management"
    hostname: "rabbitmq"
    container_name: evm_rabbitmq
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    healthcheck:
      # check_port_connectivity, not ping: `ping` only proves the Erlang VM is
      # up, so listeners still race it — a consumer connecting on that green
      # light gets ConnectionRefused. This one waits for the AMQP port to
      # actually accept connections. (The consumers also survive losing the
      # broker, so this is a readiness signal, not a crash-loop guard.)
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - ev-dealer-network

volumes:
  rabbitmq_data:
    driver: local
  rabbitmq_logs:
    driver: local
  postgres_data:
    driver: local

networks:
  ev-dealer-network:
    driver: bridge